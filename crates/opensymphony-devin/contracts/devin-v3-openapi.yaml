            ''working'' (actively working), ''waiting_for_user'' (needs user input), ''waiting_for_approval''
            (awaiting action approval in safe mode), or ''finished'' (task complete). When status is ''suspended'':
            the reason for suspension such as ''inactivity'', ''user_request'', ''usage_limit_exceeded'',
