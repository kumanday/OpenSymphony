          anyOf:
          - enum:
            - normal
            - fast
            - lite
            - ultra
            - fusion
            type: string
          - type: 'null'
          description: Override the Devin agent mode for the session. 'normal' uses the default Agent
            mode, 'fast' uses Fast mode, 'lite' uses Devin Lite, 'ultra' uses Devin Ultra, and 'fusion'
            uses Fusion. Preview modes are subject to the same feature flag and enterprise agent preview
            restrictions as the web app.
          title: Devin Mode
        knowledge_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Knowledge Ids
        max_acu_limit:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Acu Limit
        platform:
          anyOf:
          - type: string
          - type: 'null'
          description: "Override the VM platform for the session (e.g. 'windows'), or the name of an outpost\
            \ (BYOB) pool to run the session on one of your own machines. When omitted (or set to 'inherit'),\
            \ a session created by a parent Devin inherits the parent's placement \u2014 both its platform\
            \ and its outpost pool, so an outpost-placed parent spawns children on the same pool; otherwise\
            \ the organization default is used. Any value must match either a platform configured for\
            \ your organization or an outpost pool name (case-insensitive) \u2014 built-in platforms take\
            \ priority when a name matches both. Unrecognized values are rejected with a 400 whose error\
            \ body lists the available platform labels and outpost pool names for the org."
          title: Platform
        playbook_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Playbook Id
        prompt:
          title: Prompt
          type: string
        repos:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Repos
        resumable:
          default: true
          description: Whether to preserve the session's VM state after it stops so the session can be
            resumed. Set to false for disposable sessions.
          title: Resumable
          type: boolean
        secret_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Secret Ids
        session_links:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Session Links
        session_secrets:
          anyOf:
          - items:
              $ref: '#/components/schemas/SessionSecretInput'
            type: array
          - type: 'null'
          title: Session Secrets
        structured_output_required:
          anyOf:
          - type: boolean
          - type: 'null'
          description: "When true (default), the agent MUST call provide_structured_output with is_final=true\
            \ before its turn ends. When false, the tool is available but not required \u2014 it is not\
            \ guaranteed to be called in a given turn."
          title: Structured Output Required
        structured_output_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: JSON Schema (Draft 7) for validating structured output. Max 64KB. Must be self-contained
            (no external $ref).
          title: Structured Output Schema
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
