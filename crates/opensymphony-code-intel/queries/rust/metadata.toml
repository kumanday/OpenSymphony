language = "rust"
version = "rust-query-pack-v2"
grammar_crate = "tree-sitter-rust"
grammar_version = "0.24.2"
parser_crate = "tree-sitter"
parser_version = "0.26.9"

[captures]
"definition.function" = "Free function definition"
"definition.method" = "Trait method signature"
"definition.struct" = "Struct definition"
"definition.enum" = "Enum definition"
"definition.trait" = "Trait definition"
"import.source" = "Use declaration path"
"reference.call" = "Call expression"
"doc.comment" = "Rust doc or line/block comment"
"local.definition" = "Local let binding"
"diagnostic.error" = "Tree-sitter error node"
