language = "jsx"
version = "jsx-query-pack-v1"
grammar_crate = "tree-sitter-javascript"
grammar_version = "0.25.0"
parser_crate = "tree-sitter"
parser_version = "0.26.9"

[captures]
"definition.function" = "Function or function-valued variable definition"
"definition.class" = "Class definition"
"definition.method" = "Class/object method definition"
"definition.variable" = "Variable definition"
"import.source" = "Import source string"
"reference.call" = "Call expression"
"test.case" = "Syntactic test or it call"
"doc.comment" = "Comment node"
"local.definition" = "Lexical variable binding"
"injection.content" = "JSX content"
"diagnostic.error" = "Tree-sitter error node"
