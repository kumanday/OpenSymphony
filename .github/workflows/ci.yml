name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
  acp-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ACP Windows process ownership regressions
        run: |
          python scripts/validation/windows-rename-probe.py
          python scripts/validation/check-acp-windows.py
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install
        run: npm install
      - name: build-schema
        run: npm run build --workspace=@opensymphony/gateway-schema
      - name: typecheck
        run: npm run type-check
      - name: build-web
        run: npm run build --workspace=@opensymphony/web
      - name: install-playwright
        run: npx playwright install --with-deps chromium
      - name: jest
        run: npx jest --config jest.config.js --testPathIgnorePatterns="apps"
