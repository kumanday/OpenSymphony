# cargo-nextest configuration. CI runs `cargo nextest run --profile ci`.
# Local runs may use the default profile; `cargo test` remains supported.

[profile.default]
# Report tests that run longer than this; slow tests are not terminated.
slow-timeout = { period = "30s" }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "30s" }

[profile.ci.junit]
# Written to target/nextest/ci/junit.xml and summarized into the job summary.
path = "junit.xml"
